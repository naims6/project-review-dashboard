paths:
  /api/v1/mentor/projects:
    get:
      tags:
        - Mentor
      summary: List projects with pagination and status filters (Mentor)
      description: Returns a paginated list of projects, optionally filtered by status (PENDING, APPROVED, REJECTED).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Items per page
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
          description: Filter by project status
        - name: search
          in: query
          schema:
            type: string
          description: Search projects by name (case-insensitive substring)
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction by date (asc for oldest first, desc for newest first)
      responses:
        200:
          description: Projects retrieved successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden (Mentor only)

  /api/v1/mentor/projects/{id}:
    get:
      tags:
        - Mentor
      summary: View one submission and its details (Mentor)
      description: Returns complete details of a project submission including student information.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project ID
      responses:
        200:
          description: Project retrieved successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden (Mentor only)
        404:
          description: Project not found

  /api/v1/mentor/projects/{id}/review:
    patch:
      tags:
        - Mentor
      summary: Approve or reject a submission (Mentor)
      description: Mentors can update project status to APPROVED or REJECTED with an optional review comment.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  example: APPROVED
                reviewComment:
                  type: string
                  example: Great job! Clean code and good UI implementation.
      responses:
        200:
          description: Project review recorded successfully
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: Forbidden (Mentor only)
        404:
          description: Project not found

  /api/v1/mentor/stats:
    get:
      tags:
        - Mentor
      summary: Get project statistics (Mentor)
      description: Returns total, pending, approved, and rejected project counts.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Mentor stats retrieved successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden (Mentor only)
