paths:
  /api/v1/projects:
    post:
      tags:
        - Projects
      summary: Submit a project (Student)
      description: Allows an authenticated student to submit a new project for review.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - repoUrl
                - liveUrl
                - description
              properties:
                name:
                  type: string
                  example: Portfolio Website
                repoUrl:
                  type: string
                  format: uri
                  example: https://github.com/student/portfolio
                liveUrl:
                  type: string
                  format: uri
                  example: https://portfolio.vercel.app
                description:
                  type: string
                  example: Full-stack developer portfolio built with Next.js and Tailwind.
      responses:
        201:
          description: Project submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreatedResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        409:
          $ref: '#/components/responses/ConflictError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/v1/projects/me:
    get:
      tags:
        - Projects
      summary: List the student's own submissions (Student)
      description: Returns all project submissions belonging to the logged-in student.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Items per page
      responses:
        200:
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectsResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/v1/projects/{id}:
    get:
      tags:
        - Projects
      summary: Get details of a submitted project (Student)
      description: Returns details of a specific project submitted by the logged-in student.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Project ID
      responses:
        200:
          description: Project details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreatedResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'
